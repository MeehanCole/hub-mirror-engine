name: hub-mirror
on:
  workflow_dispatch:
    inputs:
      mirrors:
        description: '镜像列表 JSON'
        required: true
      platform:
        description: '架构'
        required: false
        default: 'linux/amd64,linux/arm64'
      large_image:
        description: '是否清理磁盘（大镜像时启用，会额外耗时 2-3 分钟）'
        required: false
        default: 'false'
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Disk Space (Before Cleanup)
        if: ${{ github.event.inputs.large_image == 'true' }}
        run: |
          echo "=== Disk usage before cleanup ==="
          df -h
      - name: Free Disk Space
        if: ${{ github.event.inputs.large_image == 'true' }}
        uses: jlumbroso/free-disk-space@main
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - name: Disk Space (After Cleanup)
        if: ${{ github.event.inputs.large_image == 'true' }}
        run: |
          echo "=== Disk usage after cleanup ==="
          df -h
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: 'togettoyou/hub-mirror'
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.20'
      - name: Run Mirror
        run: |
          go run main.go --username="${{ secrets.DOCKER_USERNAME }}" --password="${{ secrets.DOCKER_PASSWORD }}" --repository="${{ secrets.DOCKER_REPOSITORY }}" --content='${{ github.event.inputs.mirrors }}' --maxContent=11 --outputPath=output.md
