name: hub-mirror
on:
  workflow_dispatch:
    inputs:
      mirrors:
        description: '镜像列表 JSON'
        required: true
      platform:
        description: '架构'
        required: false
        default: 'linux/amd64,linux/arm64'
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: 'togettoyou/hub-mirror'
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.20'
      - name: Run Mirror
        run: |
          go run main.go --username="\${{ secrets.DOCKER_USERNAME }}" --password="\${{ secrets.DOCKER_PASSWORD }}" --repository="\${{ secrets.DOCKER_REPOSITORY }}" --content='\${{ github.event.inputs.mirrors }}' --maxContent=${maxImages} --outputPath=output.md
